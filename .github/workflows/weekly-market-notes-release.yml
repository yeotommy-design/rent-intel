name: RentIntel Weekly Market Notes Release

on:
  schedule:
    # Monday 09:00 Singapore Time = Monday 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      run_release:
        description: "Run release:market-notes (rebuild, verify, commit, push). Set false to skip."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  weekly-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check latest Market Notes status
        id: check
        run: |
          node ./scripts/weekly-market-notes-check.mjs > /tmp/market-notes-status.json
          cat /tmp/market-notes-status.json
          IS_HEALTHY=$(node -e "const fs=require('fs'); const status=JSON.parse(fs.readFileSync('/tmp/market-notes-status.json','utf8')); process.stdout.write(status.isPipelineHealthy ? 'true' : 'false');")
          OVERDUE=$(node -e "const fs=require('fs'); const status=JSON.parse(fs.readFileSync('/tmp/market-notes-status.json','utf8')); process.stdout.write(status.overdue ? 'true' : 'false');")
          echo "IS_HEALTHY=$IS_HEALTHY" >> $GITHUB_OUTPUT
          echo "OVERDUE=$OVERDUE" >> $GITHUB_OUTPUT

      - name: Configure git identity
        if: ${{ steps.check.outputs.IS_HEALTHY == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_release == 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Monday release when healthy
        if: steps.check.outputs.IS_HEALTHY == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_release == 'true')
        run: npm run release:market-notes

      - name: Submit sitemap after release
        if: steps.check.outputs.IS_HEALTHY == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_release == 'true')
        run: npm run submit:sitemap

      - name: Open/refresh release failure issue
        if: failure() && steps.check.outputs.IS_HEALTHY == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "RentIntel Market Notes release failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            const body = `## Market Notes release failed\n\n` +
              `Workflow: \`${{ github.workflow }}\`\n` +
              `Run: [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n` +
              `Event: \`${{ github.event_name }}\`\n` +
              `Triggered by: \`${{ github.actor }}\`\n` +
              `Status: release step failed after passing the pipeline health check`;

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Open/refresh overdue article issue
        if: failure() && steps.check.outputs.OVERDUE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const status = JSON.parse(fs.readFileSync("/tmp/market-notes-status.json", "utf8"));
            const title = "RentIntel weekly article is overdue";
            const reasons = Array.isArray(status.failureReasons) && status.failureReasons.length
              ? status.failureReasons.map((item) => `- ${item}`).join("\n")
              : "- Latest weekly article is overdue";
            const body = `## Monday article is overdue\n\n` +
              `Latest slug: \`${status.latestSlug}\`\n` +
              `Title: ${status.latestTitle}\n` +
              `Published at: ${status.publishedAt} (${status.publishedAtGapDays} days ago)\n\n` +
              `### Why this needs attention\n${reasons}\n\n` +
              `This means the weekly renderer may still be working, but a fresh Monday article was not added in time.\n\n` +
              `Suggested next steps:\n` +
              `- add the new Monday article into data/market-notes.json\n` +
              `- run npm run publish:market-notes\n` +
              `- run npm run release:market-notes\n` +
              `- run npm run submit:sitemap`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
